server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    # Look the API up through Docker's DNS on each request (cached 10s), not once at startup:
    # when the api container is rebuilt it gets a new address, and a startup lookup would keep
    # sending requests to the old one (502 until web is restarted).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4500;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Single-page app: every other path loads index.html.
    location / {
        try_files $uri /index.html;
    }
}
